<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:#f5f6fa;}
.layout{display:flex;}

.sidebar{
width:220px;background:#0d1b2a;color:white;height:100vh;padding:20px;
}

.sidebar li{margin:15px 0;cursor:pointer;}

.main{flex:1;padding:20px;}

.kpi{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{background:white;padding:20px;border-radius:12px;}

.charts{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
margin-top:30px;
}

.chart-box{background:white;padding:20px;border-radius:12px;}

.table-box{
background:white;padding:20px;border-radius:12px;margin-top:30px;
}

.badge{padding:5px 10px;border-radius:6px;color:white;}
.pending{background:gray;}
.progress{background:orange;}
.completed{background:green;}

.modal{
display:none;position:fixed;width:100%;height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;align-items:center;
}

.modal-content{
background:white;padding:20px;border-radius:10px;width:400px;
}
</style>
</head>

<body>

<div class="layout">

<div class="sidebar">
<h2>BlitzTech</h2>
<ul>
<li onclick="scrollToSection('dashboard')">Dashboard</li>
<li onclick="scrollToSection('tasks')">Tasks</li>
<li onclick="scrollToSection('jobs')">Job Cards</li>
<li onclick="scrollToSection('performance')">Performance</li>
</ul>
</div>

<div class="main">

<h1 id="adminName">Admin Dashboard</h1>

<!-- KPI -->
<div class="kpi">
<div class="card"><h3>Total Tasks</h3><p id="totalTasks">0</p></div>
<div class="card"><h3>Completed</h3><p id="completedTasks">0</p></div>
<div class="card"><h3>In Progress</h3><p id="inProgressTasks">0</p></div>
<div class="card"><h3>Hours</h3><p id="hoursWorked">0h</p></div>
</div>

<!-- CHARTS -->
<div class="charts">
<div class="chart-box">
<h3>Productivity</h3>
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<h3>Status</h3>
<canvas id="pieChart"></canvas>
</div>
</div>

<!-- TASKS -->
<h2>Tasks</h2>

<table id="adminTasksTable">
<thead>
<tr>
<th>Title</th>
<th>Description</th>
<th>User</th>
<th>Status</th>
<th>Created</th>
<th>Duration</th>
</tr>
</thead>
<tbody></tbody>
</table>
<!-- JOBS -->
<div class="table-box" id="jobsSection">
<h3>Job Cards</h3>
<table>
<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="jobsTable"></tbody>
</table>
</div>

</div>
</div>

<!-- TASK MODAL -->
<div id="taskModal" class="modal">
<div class="modal-content">
<h3>Task</h3>
<p id="modalTitle"></p>
<p id="modalDescription"></p>
<p id="modalStatus"></p>
<p id="modalTime"></p>
<button onclick="closeModal()">Close</button>
</div>
</div>

<script src="admin.js"></script>
</body>
</html>
