<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- USER PANEL -->
    <div class="user-panel">
        <div class="user-info">
            <span id="userInfo"></span>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="brand">
                <h2>My Dashboard</h2>
                <h3 class="company-name">Blitztech Electronics</h3>
            </div>
        </div>

        <!-- NOTIFICATIONS -->
        <h3>Notifications</h3>
        <div id="notifications"></div>

        <!-- ========================== -->
        <!-- JOB CARDS (NEW 🔥) -->
        <!-- ========================== -->
        <h3>My Job Cards</h3>
        <div id="jobCards"></div>

        <!-- ========================== -->
        <!-- TASKS (EXISTING) -->
        <!-- ========================== -->
        <h3>My Tasks</h3>
        <div id="tasks"></div>

    </div>

    <!-- SCRIPTS -->
    <script src="api.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
