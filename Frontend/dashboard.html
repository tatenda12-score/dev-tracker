<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .main-layout{
            display:flex;
        }

        /* RIGHT SIDEBAR */
        .sidebar{
            width:200px;
            background:#0d1b2a;
            padding:20px;
            height:100vh;
            position:fixed;
            right:0;
            top:0;
        }

        .sidebar button{
            width:100%;
            padding:12px;
            margin-bottom:10px;
            background:#1b263b;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:6px;
        }

        .sidebar button:hover{
            background:#415a77;
        }

        /* MAIN CONTAINER */
        .container{
            margin:120px auto 40px auto;
            margin-right:240px;

            width:60%;
            min-width:600px;
            max-width:900px;

            background:white;
            padding:30px;
            border-radius:16px;
            box-shadow:0 6px 20px rgba(0,0,0,0.15);
        }

        /* 🔔 ALERT BOX */
        #jobAlert{
            display:none;
            background:#ff4d4d;
            color:white;
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            font-weight:bold;
        }

        /* 🔥 NEW JOB HIGHLIGHT */
        .new-job{
            border-left:6px solid red;
            animation:pulse 1s infinite;
        }

        @keyframes pulse{
            0%{ transform:scale(1); }
            50%{ transform:scale(1.01); }
            100%{ transform:scale(1); }
        }

    </style>

</head>

<body>

    <!-- USER PANEL -->
    <div class="user-panel">
        <div class="user-info">
            <span id="userInfo"></span>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <button onclick="showSection('tasks')">My Tasks</button>
            <button onclick="showSection('jobs')">My Job Cards</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="container">

            <!-- HEADER -->
            <div class="top-bar">
                <div class="brand">
                    <h2>My Dashboard</h2>
                    <h3 class="company-name">Blitztech Electronics</h3>
                </div>
            </div>

            <!-- 🔔 JOB ALERT -->
            <div id="jobAlert">
                🔔 New Job Assigned! Please start it.
            </div>

            <!-- NOTIFICATIONS -->
            <h3>Notifications</h3>
            <div id="notifications"></div>

            <!-- TASKS -->
            <div id="tasksSection">
                <h3>My Tasks</h3>
                <div id="tasks"></div>
            </div>

            <!-- JOB CARDS -->
            <div id="jobsSection" style="display:none;">
                <h3>My Job Cards</h3>
                <div id="jobCards"></div>
            </div>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="api.js"></script>
    <script src="dashboard.js"></script>

</body>
</html>
